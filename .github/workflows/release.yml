name: Release

# Every push: run the rule tests, build the Windows folder, start each program on its sample clip.
# A tag that starts with v also publishes the zip and its checksum as a release.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rules:
    name: Rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the rule tests
        working-directory: pipeline
        run: python -m unittest discover -s tests -v

  windows:
    name: Windows build
    needs: rules
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install "opencv-python>=4.9" "numpy>=1.26" "pillow>=10" onnxruntime-directml pyinstaller

      - name: Run the app tests from source
        run: python -m unittest discover -s tests -v

      - name: Build the folder
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean sentinel.spec || exit /b 1
          for %%D in (models samples zones fonts) do robocopy "%%D" "dist\SentinelVision\%%D" /E /NFL /NDL /NJH /NJS /NP
          copy /y RELEASE_README.md dist\SentinelVision\README.md || exit /b 1
          copy /y ..\LICENSE dist\SentinelVision\LICENSE.txt || exit /b 1
          dir dist\SentinelVision
          exit /b 0

      - name: Start each EXE on its sample clip
        shell: pwsh
        working-directory: app/dist/SentinelVision
        run: |
          $expected = [ordered]@{ Office = 'WORKING -> ABSENT'; Shop = 'person entered'; Home = 'vehicle arrived'; Exam = 'seats=([5-9]|10)' }
          foreach ($name in $expected.Keys) {
            $report = "report_$name.txt"
            $p = Start-Process -FilePath ".\Sentinel$name.exe" -Wait -PassThru -ArgumentList '--headless', '--model', 'n', '--imgsz', '640', '--device', 'cpu', '--max-frames', '150', '--report-file', $report
            if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) {
              if (Test-Path sentinel.log) { Get-Content sentinel.log }
              throw "Sentinel$name.exe did not finish (exit code $($p.ExitCode))"
            }
            Get-Content $report
            if (-not (Select-String -Path $report -Pattern $expected[$name] -Quiet)) { throw "Sentinel$name.exe ran but did not report: $($expected[$name])" }
          }
          # Once more with the default device, to record which one this machine ends up using.
          $p = Start-Process -FilePath .\SentinelHome.exe -Wait -PassThru -ArgumentList '--headless', '--model', 'n', '--imgsz', '640', '--max-frames', '60', '--report-file', 'report_device.txt'
          if ($p.ExitCode -ne 0 -or -not (Test-Path report_device.txt)) {
            if (Test-Path sentinel.log) { Get-Content sentinel.log }
            throw "SentinelHome.exe did not finish on the default device (exit code $($p.ExitCode))"
          }
          Get-Content report_device.txt
          if (Test-Path sentinel.log) { Get-Content sentinel.log }
          Remove-Item report_*.txt, sentinel.log -ErrorAction SilentlyContinue
          if (Test-Path logs) { Remove-Item logs -Recurse -Force }

      - name: Zip and checksum
        shell: pwsh
        run: |
          7z a -tzip -mx=7 SentinelVision-windows-x64.zip .\dist\SentinelVision | Select-Object -Last 4
          $hash = (Get-FileHash SentinelVision-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SentinelVision-windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          "{0:N0} bytes" -f (Get-Item SentinelVision-windows-x64.zip).Length

      - uses: actions/upload-artifact@v4
        with:
          name: SentinelVision-windows-x64
          path: |
            app/SentinelVision-windows-x64.zip
            app/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME SentinelVision-windows-x64.zip SHA256SUMS.txt --title "Sentinel Vision $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file ..\RELEASE_NOTES.md
